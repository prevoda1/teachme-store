<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — TeachMe</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="announcement">Educators save 15% — use code <strong>EDUCATOR15</strong></div>
  <header class="nav">
    <a class="logo" href="index.html">TEACH<span>ME</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="ai-style.html">AI Style Mentor</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="cart-btn" onclick="toggleCart()">Bag <span id="cart-count">0</span></button>
  </header>
  <section class="page-hero">
    <h1>The catalog</h1>
    <p>Premium pieces priced at best-available value. Filter by category or body-type friendliness.</p>
  </section>
  <section class="section shop-layout">
    <aside class="filters">
      <h3>Category</h3>
      <button class="chip on" data-cat="all">All</button>
      <button class="chip" data-cat="outerwear">Outerwear</button>
      <button class="chip" data-cat="dresses">Dresses</button>
      <button class="chip" data-cat="knitwear">Knitwear</button>
      <button class="chip" data-cat="bags">Bags</button>
      <button class="chip" data-cat="shoes">Shoes</button>
      <button class="chip" data-cat="accessories">Accessories</button>
      <h3>Body-type friendly</h3>
      <button class="chip" data-body="all">All builds</button>
      <button class="chip" data-body="slim">Slim / athletic</button>
      <button class="chip" data-body="curvy">Curvy / hourglass</button>
      <button class="chip" data-body="plus">Plus / full figure</button>
      <button class="chip" data-body="petite">Petite</button>
      <button class="chip" data-body="tall">Tall</button>
      <button class="chip" data-body="male">Menswear</button>
    </aside>
    <div class="grid products" id="shop-grid"></div>
  </section>
  <footer>
    <div><strong>TEACHME</strong><p>Classroom-ready luxury.</p></div>
    <p class="fine">© 2026 TeachMe</p>
  </footer>
  <aside id="cart" class="cart">
    <div class="cart-head"><h3>Your bag</h3><button onclick="toggleCart()">Close</button></div>
    <div id="cart-items"></div>
    <div class="cart-foot">
      <label>Promo <input id="promo" placeholder="EDUCATOR15" /></label>
      <p>Subtotal <span id="cart-total">$0</span></p>
      <button class="btn" onclick="checkout()">Checkout (demo)</button>
    </div>
  </aside>
  <div id="overlay" class="overlay" onclick="toggleCart()"></div>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
  <script>initShop(); updateCartUI();</script>
</body>
</html>
