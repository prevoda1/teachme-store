<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — TeachMe</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html">TEACH<span>ME</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="ai-style.html">AI Style Mentor</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="cart-btn" onclick="toggleCart()">Bag <span id="cart-count">0</span></button>
  </header>
  <section class="page-hero">
    <h1>Write us</h1>
    <p>Sizing, wholesale for districts, or Style Mentor feedback.</p>
  </section>
  <section class="section">
    <form class="contact" onsubmit="event.preventDefault(); this.reset(); alert('Message saved locally. In production this would email the studio.');">
      <label>Name <input required /></label>
      <label>Email <input type="email" required /></label>
      <label>School / campus <input /></label>
      <label>Message <textarea required rows="5"></textarea></label>
      <button class="btn" type="submit">Send</button>
    </form>
  </section>
  <footer><p class="fine">hello@teachme.store · Demo only</p></footer>
  <aside id="cart" class="cart">
    <div class="cart-head"><h3>Your bag</h3><button onclick="toggleCart()">Close</button></div>
    <div id="cart-items"></div>
    <div class="cart-foot">
      <label>Promo <input id="promo" placeholder="EDUCATOR15" /></label>
      <p>Subtotal <span id="cart-total">$0</span></p>
      <button class="btn" onclick="checkout()">Checkout (demo)</button>
    </div>
  </aside>
  <div id="overlay" class="overlay" onclick="toggleCart()"></div>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
  <script>updateCartUI();</script>
</body>
</html>
